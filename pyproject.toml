[project]
name = "medical-rcm"
version = "0.0.0"
description = "AI-native medical Revenue Cycle Management — Phase 0 (read-only) + compliance guardrail"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "cryptography>=44.0",
    "anthropic>=0.40",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Markers keep the infra-free suite (the compliance gate) separable from
# tests that need a live Postgres. Run the gate with: pytest -m "not postgres"
markers = [
    "postgres: test requires a live Postgres+pgvector (docker compose up)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
# UP042: `str, Enum` is intentional (JSON-serializable, .value everywhere).
ignore = ["UP042"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S311"]  # non-crypto randomness is fine for synthetic data

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rcm"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["rcm"]
branch = true
